x-app-env: &app-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  DB_CONNECTION: sqlite
  DB_DATABASE: /var/www/html/database/database.sqlite
  DB_FOREIGN_KEYS: "true"
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  SESSION_DRIVER: database
  FILESYSTEM_DISK: local
  SCOUT_DRIVER: typesense
  SCOUT_QUEUE: "true"
  TYPESENSE_HOST: typesense
  TYPESENSE_PORT: "8108"
  TYPESENSE_PROTOCOL: http
  TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - sqlite-data:/var/www/html/database
    depends_on:
      typesense:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan up >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    env_file:
      - .env
    environment:
      <<: *app-env
    volumes:
      - sqlite-data:/var/www/html/database
    depends_on:
      typesense:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
    volumes:
      - typesense-data:/data
    ports:
      - "8108:8108"
    command: '--data-dir /data --api-key=${TYPESENSE_API_KEY:-xyz} --enable-cors'
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q '\"ok\":true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

volumes:
  sqlite-data:
  typesense-data:
